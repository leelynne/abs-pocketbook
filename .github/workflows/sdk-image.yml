# Builds the PocketBook SDK toolchain image and pushes it to GHCR.
#
# Run by hand: the SDK is a fixed upstream release, so this only needs to run
# when that release changes or the Dockerfile does. Every other workflow just
# pulls the result.
name: SDK image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        default: "6.8-b288"
        required: true
  push:
    branches: [main, ci]
    paths:
      - docker/sdk.Dockerfile
      - .github/workflows/sdk-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: sdk-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Extracting the SDK needs ~7 GB before the prune runs.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: docker/sdk.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pocketbook-sdk:${{ inputs.tag || '6.8-b288' }}
          # The image is large and rebuilt rarely; layer caching buys little.
          provenance: false
