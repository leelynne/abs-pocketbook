name: CI

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_IMAGE: ghcr.io/leelynne/pocketbook-sdk:6.8-b288

jobs:
  # ---------------------------------------------------------------- fast ---
  # src/core has no inkview dependency, so most of the value needs no SDK.
  test:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make test
        # -Werror in CI only: a new compiler warning should block a PR without
        # blocking someone's local build.
        run: make test HOST_CC="cc -Werror"

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests under sanitizers
        # core/ parses untrusted JSON, filenames and on-disk state, and the
        # suite already feeds it malformed input -- so this is where a memory
        # bug surfaces cheaply.
        run: |
          make test HOST_CC="cc -fsanitize=address,undefined \
            -fno-sanitize-recover=all -fno-omit-frame-pointer -g"

  analyze:
    name: Static analysis (core)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck
        run: |
          cppcheck --error-exitcode=1 --inline-suppr \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            -I src src/core tests

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run fuzz targets briefly
        # The parsers are pure functions over attacker-controlled bytes, which
        # makes them unusually good fuzz targets. 10s each is a smoke test; the
        # nightly workflow runs them properly.
        run: make fuzz FUZZ_SECONDS=10

  # ----------------------------------------------------------- needs SDK ---
  build:
    name: Cross-compile (ARM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/leelynne/pocketbook-sdk:6.8-b288
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build app and spike
        # BUILD_ID is passed in: the container has no git, so letting the
        # Makefile work it out would stamp "dev".
        run: |
          BUILD_ID=$(echo "${{ github.sha }}" | cut -c1-7)
          make SDK_ROOT=/SDK BUILD_ID="$BUILD_ID"
          make spike SDK_ROOT=/SDK BUILD_ID="$BUILD_ID"

      - name: Verify the binary
        # These checks only fail on the device otherwise, where the symptom is
        # "the app doesn't launch" with no diagnostics.
        shell: bash
        run: |
          set -eux
          READELF=/SDK/usr/bin/arm-obreey-linux-gnueabi-readelf
          $READELF -h build/ABSClient.app | grep -q "Machine:.*ARM"
          $READELF -h build/ABSClient.app | grep -q "soft-float ABI"
          NEEDED=$($READELF -d build/ABSClient.app | grep NEEDED)
          for lib in libinkview.so libcurl.so libfreetype.so libc.so; do
            echo "$NEEDED" | grep -q "$lib"
          done
          # sqlite is linked statically on purpose.
          if echo "$NEEDED" | grep -q libsqlite3; then
            echo "sqlite must be static"; exit 1
          fi

      - name: No credentials in the binary
        # Direct regression gate on the leak found in the security review: an
        # API key must never reach a URL, and this exact bug once shipped.
        # bash explicitly: the container's default shell is dash, which has no
        # here-strings.
        shell: bash
        run: |
          SYMS=$(strings build/ABSClient.app)
          if grep -qE "(cover|download)\?token=" <<<"$SYMS"; then
            echo "token-in-URL format string present"; exit 1
          fi
          grep -q "REDACTED" <<<"$SYMS" || { echo "log redaction missing"; exit 1; }
          if grep -qE "eyJ[A-Za-z0-9_-]{16,}" <<<"$SYMS"; then
            echo "embedded JWT"; exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ABSClient-${{ github.sha }}
          path: build/ABSClient.app
          retention-days: 14
